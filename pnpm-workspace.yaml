  - 'packages/workflow-core'
  - 'packages/workflow-netlify'
  - 'packages/workflow-railway'
  - 'packages/workflow-runtime'
  - 'packages/workflow-store-cloudflare-d1'
  - 'packages/workflow-store-drizzle-postgres'
  - 'packages/workflow-vercel'
onlyBuiltDependencies:
  - esbuild
